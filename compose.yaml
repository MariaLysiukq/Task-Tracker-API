services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # Local database for tests only: docker compose --profile test up -d test-db
  test-db:
    image: postgres:16-alpine
    profiles: [ "test" ]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: task_tracker_test
    ports:
      - "5433:5432"
