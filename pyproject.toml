[project]
name = "task-tracker-api"
version = "0.1.0"
description = "Team task tracker API with projects, members, tasks and comments."
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 100
src = [".", "app"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "N", "C4", "D", "S"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# pytest relies on plain assert statements.
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
branch = true
