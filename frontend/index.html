<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Tracker</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<section id="auth" hidden>
  <div class="auth-panel">
    <div class="stack">
      <h1>Task Tracker</h1>
      <p class="muted">Projects, tasks and the conversations around them, in one place.</p>
    </div>
    <div class="auth-switch" role="group" aria-label="Account">
      <button type="button" id="show-login" aria-pressed="true">Sign in</button>
      <button type="button" id="show-register" aria-pressed="false">Create account</button>
    </div>
    <form id="login-form" class="stack">
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Sign in</button>
    </form>
    <form id="register-form" class="stack" hidden>
      <label>Full name<input name="full_name" autocomplete="name" maxlength="100" required></label>
      <label>Email<input name="email" type="email" autocomplete="email" maxlength="320" required></label>
      <label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        <span>At least 8 characters.</span></label>
      <button class="primary" type="submit">Create account</button>
    </form>
  </div>
</section>

<div id="app" hidden>
  <header class="topbar">
    <span class="wordmark">Task Tracker</span>
    <div class="whoami">
      <span id="me-name"></span>
      <span class="mono muted" id="me-id" title="Share this ID so a project owner can add you"></span>
      <button type="button" id="sign-out">Sign out</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="Projects">
      <h2>Projects</h2>
      <ul class="project-list" id="project-list"></ul>
      <form id="new-project" class="inline-form">
        <input name="name" placeholder="New project" aria-label="New project name" maxlength="100" required>
        <button type="submit">Create</button>
      </form>
    </aside>
    <main id="main">
      <div id="no-project" class="empty-state" hidden>
        <h1>No project selected</h1>
        <p class="muted">Create a project on the left to start tracking tasks, or ask a project owner to add you with your ID.</p>
      </div>
      <div id="project-view" hidden>
        <div class="stack loose">
          <div class="project-head" id="project-head"></div>
          <details class="members" id="members"></details>
          <div class="toolbar">
            <form class="new-task" id="new-task">
              <label>New task<input name="title" maxlength="150" required placeholder="What needs doing?"></label>
              <label>Priority<select name="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label>
              <label>Assignee<select name="assignee_id" id="new-task-assignee"></select></label>
              <label>Due<input name="due_at" type="datetime-local"></label>
              <button class="primary" type="submit">Add task</button>
            </form>
            <div class="filters" id="filters"></div>
            <div class="filter-status" id="filter-status" role="status" hidden></div>
          </div>
          <div class="col-tabs" role="tablist" aria-label="Status" id="col-tabs"></div>
          <div class="board" id="board"></div>
          <div id="more"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<dialog id="task-dialog" aria-labelledby="task-dialog-title"><div class="sheet" id="sheet"></div></dialog>
<div id="notice" role="status" aria-live="polite"></div>

</body>
</html>
