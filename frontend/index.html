<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Tracker</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/theme.js"></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<section id="auth" hidden>
  <div class="auth-panel">
    <div class="stack">
      <h1 class="auth-title"><svg class="mark" viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><g transform="rotate(-90 12 12)"><circle class="mark-arc mark-todo" cx="12" cy="12" r="9" pathLength="100" stroke-dasharray="26 74" stroke-dashoffset="0"/><circle class="mark-arc mark-in_progress" cx="12" cy="12" r="9" pathLength="100" stroke-dasharray="26 74" stroke-dashoffset="-33.33"/><circle class="mark-arc mark-done" cx="12" cy="12" r="9" pathLength="100" stroke-dasharray="26 74" stroke-dashoffset="-66.67"/></g><path class="mark-check" d="M8.4 12.3l2.5 2.5 4.8-5.1"/></svg>Task Tracker</h1>
      <p class="muted">Projects, tasks and the conversations around them, in one place.</p>
    </div>
    <div class="auth-switch" role="group" aria-label="Account">
      <button type="button" id="show-login" aria-pressed="true">Sign in</button>
      <button type="button" id="show-register" aria-pressed="false">Create account</button>
    </div>
    <form id="login-form" class="stack">
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Sign in</button>
    </form>
    <form id="register-form" class="stack" hidden>
      <label>Full name<input name="full_name" autocomplete="name" maxlength="100" required></label>
      <label>Email<input name="email" type="email" autocomplete="email" maxlength="320" required></label>
      <label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        <span>At least 8 characters.</span></label>
      <button class="primary" type="submit">Create account</button>
    </form>
  </div>
</section>

<div id="app" hidden>
  <div class="nav-backdrop" id="nav-backdrop" hidden></div>
  <aside class="sidebar" id="sidebar" aria-label="Navigation">
    <div class="sidebar-top">
      <span class="wordmark"><svg class="mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><g transform="rotate(-90 12 12)"><circle class="mark-arc mark-todo" cx="12" cy="12" r="9" pathLength="100" stroke-dasharray="26 74" stroke-dashoffset="0"/><circle class="mark-arc mark-in_progress" cx="12" cy="12" r="9" pathLength="100" stroke-dasharray="26 74" stroke-dashoffset="-33.33"/><circle class="mark-arc mark-done" cx="12" cy="12" r="9" pathLength="100" stroke-dasharray="26 74" stroke-dashoffset="-66.67"/></g><path class="mark-check" d="M8.4 12.3l2.5 2.5 4.8-5.1"/></svg>Task Tracker</span>
      <button type="button" class="icon-btn nav-close" id="nav-close" aria-label="Close navigation"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path class="icon-stroke" d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="nav-section">
      <button type="button" class="nav-item" id="my-tasks" aria-current="false"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle class="icon-stroke" cx="8" cy="5.5" r="2.5"/><path class="icon-stroke" d="M3 13.5c.7-2.4 2.7-3.5 5-3.5s4.3 1.1 5 3.5"/></svg>My tasks</button>
    </div>
    <nav class="nav-section" aria-labelledby="projects-title">
      <h2 class="nav-title" id="projects-title">Projects</h2>
      <ul class="project-list" id="project-list"></ul>
      <button type="button" class="nav-item" id="new-project-toggle" aria-expanded="false" aria-controls="new-project"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path class="icon-stroke" d="M8 3v10M3 8h10"/></svg>New project</button>
      <form id="new-project" class="inline-form" hidden>
        <input name="name" placeholder="Project name" aria-label="New project name" maxlength="100" required>
        <button type="submit">Create</button>
      </form>
    </nav>
    <div class="sidebar-foot">
      <div class="theme-switch" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="system" aria-pressed="false">System</button>
        <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
        <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
      </div>
      <div class="account">
        <span class="avatar" id="me-avatar" aria-hidden="true"></span>
        <span class="account-text"><span class="account-name" id="me-name"></span><span class="mono muted" id="me-id" title="Share this ID so a project owner can add you"></span></span>
        <button type="button" class="ghost small" id="sign-out">Sign out</button>
      </div>
    </div>
  </aside>
  <main id="main">
    <header class="pagebar">
      <button type="button" class="icon-btn nav-open" id="nav-open" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path class="icon-stroke" d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg></button>
      <nav class="crumbs" aria-label="Breadcrumb"><span class="muted" id="crumb-root">Projects</span><span class="crumb-sep" aria-hidden="true">/</span><span class="crumb-current" id="crumb-project" aria-current="page"></span></nav>
      <div class="seg-toggle" id="layout-toggle" role="group" aria-label="Layout" hidden>
        <button type="button" data-layout="board" aria-pressed="true"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect class="icon-stroke" x="2" y="2.5" width="3.5" height="11" rx="1"/><rect class="icon-stroke" x="7.25" y="2.5" width="3.5" height="7" rx="1"/><rect class="icon-stroke" x="12.5" y="2.5" width="1.5" height="9" rx=".75"/></svg><span class="seg-label">Board</span></button>
        <button type="button" data-layout="list" aria-pressed="false"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path class="icon-stroke" d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg><span class="seg-label">List</span></button>
      </div>
      <div class="pop-anchor">
        <button type="button" class="primary small" id="new-task-open" aria-expanded="false" aria-controls="new-task-pop" aria-keyshortcuts="c" hidden>New task <kbd>C</kbd></button>
        <div class="popover new-task-pop" id="new-task-pop" role="dialog" aria-label="New task" hidden>
          <form class="stack" id="new-task">
            <input name="title" maxlength="150" required placeholder="Task title" aria-label="Task title" class="title-input">
            <div class="field-grid">
              <label>Priority<select name="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label>
              <label>Assignee<select name="assignee_id" id="new-task-assignee"></select></label>
              <label class="span-2">Due<input name="due_at" type="datetime-local"></label>
            </div>
            <div class="pop-actions">
              <button type="button" class="ghost" id="new-task-cancel">Cancel</button>
              <button class="primary" type="submit">Create task</button>
            </div>
          </form>
        </div>
      </div>
    </header>
    <div class="content">
      <div id="no-project" class="empty-state" hidden>
        <h1>No project selected</h1>
        <p class="muted">Create one with <strong>New project</strong> in the sidebar, or ask a project owner to add you with the ID shown under your name.</p>
      </div>
      <div id="mine-view" class="stack loose" hidden></div>
      <div id="project-view" hidden>
        <div class="stack loose">
          <div class="project-head" id="project-head"></div>
          <div class="progress" id="progress"></div>
          <details class="members" id="members"></details>
          <div class="filterbar" id="filterbar">
            <div class="pop-anchor">
              <button type="button" class="ghost small" id="filter-open" aria-expanded="false" aria-controls="filter-pop" aria-keyshortcuts="/" title="Filter (/)"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path class="icon-stroke" d="M2.5 4h11M4.5 8h7M6.5 12h3"/></svg>Filter</button>
              <div class="popover filter-pop" id="filter-pop" role="dialog" aria-label="Filters" hidden></div>
            </div>
            <ul class="pills" id="filter-pills" aria-label="Active filters"></ul>
            <span class="filter-status muted" id="filter-status" role="status"></span>
            <label class="order-select"><span class="sr-only">Order</span><select id="order-select"><option value="desc">Newest first</option><option value="asc">Oldest first</option></select></label>
          </div>
          <div class="col-tabs" role="tablist" aria-label="Status" id="col-tabs"></div>
          <div class="board" id="board"></div>
          <div class="list" id="list" hidden></div>
          <div id="more"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<dialog id="task-dialog" class="panel" aria-label="Task"><div class="sheet" id="sheet"></div></dialog>
<div id="notice" role="status" aria-live="polite"></div>

</body>
</html>
